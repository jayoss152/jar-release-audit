name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, Node 24
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and unit tests
        run: mvn -B -ntp verify
      - name: Packaged CLI and synthetic demo
        shell: bash
        run: |
          set -euo pipefail
          java examples/demo/Demo.java
          test "$(java -cp examples/demo/target/leaky.jar Hello | tr -d '\r')" = "hello release"
          test "$(java -cp examples/demo/target/hardened.jar Hello | tr -d '\r')" = "hello release"
          set +e
          java -jar target/jar-release-audit-0.1.0.jar --format json examples/demo/target/leaky.jar > target/leaky-report.json
          result=$?
          set -e
          test "$result" -eq 1
          java -jar target/jar-release-audit-0.1.0.jar --format json --fail-on low examples/demo/target/hardened.jar > target/hardened-report.json
          java -jar target/jar-release-audit-0.1.0.jar target/jar-release-audit-0.1.0.jar
      - name: Resolve optional ProGuard demo dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        run: mvn -B -ntp -f examples/proguard/pom.xml generate-resources
      - name: Verify actual ProGuard transformation
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        run: java examples/proguard/Verify.java
